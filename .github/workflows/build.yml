name: build

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Optional version, e.g. v0.2.0-beta.1. Leave blank for an automatic branch/commit name.'
        required: false
        type: string
        default: ''
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v5

      - name: Determine Version and Metadata
        env:
          REQUESTED_VERSION: ${{ inputs.kernel_version || '' }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            KERNEL_VER="$GITHUB_REF_NAME"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            KERNEL_VER="$REQUESTED_VERSION"
          else
            BRANCH_NAME=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')
            BRANCH_NAME=${BRANCH_NAME:0:40}
            KERNEL_VER="${BRANCH_NAME}-${GITHUB_SHA:0:7}-r${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$KERNEL_VER" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "Invalid version: use letters, numbers, dots, underscores, + or -." >&2
            exit 1
          fi

          IS_PRERELEASE=true
          if [[ "$GITHUB_REF_TYPE" == "tag" || -n "$REQUESTED_VERSION" ]]; then
            if [[ "$KERNEL_VER" != *-* ]]; then
              IS_PRERELEASE=false
            fi
          fi

          {
            printf 'KERNEL_VERSION=%s\n' "$KERNEL_VER"
            printf 'BUILD_DATE=%s\n' "$(date +%Y%m%d)"
            printf 'IS_PRERELEASE=%s\n' "$IS_PRERELEASE"
            printf 'ARTIFACT_NAME=MayonKernel-sweet-%s\n' "$KERNEL_VER"
          } >> "$GITHUB_ENV"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev \
            cpio zip lz4 python3 git curl ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch Neutron Clang
        run: |
          mkdir -p clang
          cd clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "$(pwd)/bin" >> $GITHUB_PATH
          cd ..
          clang --version
          
      - name: Setup pinned BakaSU
        run: |
          set -euo pipefail
          source build/bakasu.env
          [[ "$BAKASU_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BAKASU_MANAGER_RUN" =~ ^[0-9]+$ ]]
          curl -fLSs --retry 3 \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_COMMIT}/kernel/setup.sh" \
            -o "${RUNNER_TEMP}/bakasu-setup.sh"
          bash "${RUNNER_TEMP}/bakasu-setup.sh" "$BAKASU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$BAKASU_COMMIT"
          patch --batch --forward --dry-run -p1 -d KernelSU < patches/bakasu-4.14-compat.patch
          patch --batch --forward -p1 -d KernelSU < patches/bakasu-4.14-compat.patch
          printf '%s\n' "$BAKASU_COMMIT" > bakasu-commit.txt
          printf '%s\n' "$BAKASU_MANAGER_RUN" > bakasu-manager-run.txt
          printf '%s\n' "$GITHUB_SHA" > kernel-commit.txt

      - name: Show build resources
        run: |
          echo "CPU:"
          nproc
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h

      - name: Build Kernel
        run: |
          rm -rf out
          export ARCH=arm64
          export SUBARCH=arm64
          
          echo "" > .scmversion
        
          make O=out vendor/sdmsteppe-perf_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/sweet.config
          scripts/config --file out/.config \
            -d LOCALVERSION_AUTO \
            -e KSU \
            -e KSU_SUSFS -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_OPEN_REDIRECT
          
          # Disable KSU features temporarily cause of build errors
          # scripts/config --file out/.config -d KSU -d KSU_SUSFS

          make O=out olddefconfig
          grep -E 'CONFIG_KSU|CONFIG_KSU_SUSFS|LTO' out/.config

          for option in \
            MACH_XIAOMI_SWEET \
            KSU \
            KSU_SUSFS \
            SECCOMP \
            SECCOMP_FILTER \
            SECURITY_DMESG_RESTRICT \
            INIT_ON_ALLOC_DEFAULT_ON
          do
            if ! grep -qx "CONFIG_${option}=y" out/.config; then
              echo "Missing required setting: CONFIG_${option}=y" >&2
              exit 1
            fi
          done

          /usr/bin/time -v make -j3 O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs

          # Generate dtb.img
          find out/arch/arm64/boot/dts/qcom/ -name "*sweet*.dtb" -o -name "xiaomi-sdmmagpie.dtb" | sort -u | xargs cat > out/arch/arm64/boot/dtb.img

          # Generate dtbo.img using mkdtboimg
          if [ ! -f scripts/mkdtboimg.py ]; then
            curl -fsSL https://raw.githubusercontent.com/LineageOS/android_system_libufdt/lineage-20.0/utils/src/mkdtboimg.py -o scripts/mkdtboimg.py
          fi
          python3 scripts/mkdtboimg.py create out/arch/arm64/boot/dtbo.img --page_size=4096 $(find out/arch/arm64/boot/dts/qcom/ -name "*sweet*.dtbo")

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/jksalcedo/AnyKernel3.git AnyKernel3
          git -C AnyKernel3 rev-parse HEAD > anykernel-commit.txt
          cp out/.config kernel.config
          clang --version > toolchain.txt
          B=out/arch/arm64/boot
          ls -la $B
          cp $B/Image.gz AnyKernel3/ 2>/dev/null || cp $B/Image AnyKernel3/ 2>/dev/null || cp $B/Image.gz-dtb AnyKernel3/ 2>/dev/null
          [ -f $B/dtbo.img ] && cp $B/dtbo.img AnyKernel3/
          [ -f $B/dtb.img ] && cp $B/dtb.img AnyKernel3/
          [ -f $B/dtb ] && cp $B/dtb AnyKernel3/dtb.img 2>/dev/null || true
          
          # Clean up unneeded files before uploading
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/*placeholder

          # Create flashable ZIP
          ZIP_NAME="${ARTIFACT_NAME}.zip"
          (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" . -x ".git/*")
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Flashable ZIP (Action Artifact)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            bakasu-commit.txt
            bakasu-manager-run.txt
            kernel-commit.txt
            anykernel-commit.txt
            kernel.config
            toolchain.txt
          if-no-files-found: error
