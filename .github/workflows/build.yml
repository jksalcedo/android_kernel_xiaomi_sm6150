name: build

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel Version (e.g. v0.1.0-beta.1)'
        required: true
        default: 'v0.1.0-beta.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BAKASU_VERSION: 'v4.2.0-rc3'

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v5

      - name: Determine Version and Metadata
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            KERNEL_VER="${{ github.event.inputs.kernel_version }}"
          else
            KERNEL_VER="${{ github.ref_name }}"
          fi
          echo "KERNEL_VERSION=${KERNEL_VER}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

          if echo "${KERNEL_VER}" | grep -q -- '-'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev \
            cpio zip lz4 python3 git curl ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch Neutron Clang
        run: |
          mkdir -p clang
          cd clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "$(pwd)/bin" >> $GITHUB_PATH
          cd ..
          clang --version
          
      - name: Setup BakaSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_VERSION}/kernel/setup.sh" | bash -s "${BAKASU_VERSION}"
          patch -p1 -d KernelSU < patches/bakasu-4.14-compat.patch

      - name: Show build resources
        run: |
          echo "CPU:"
          nproc
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h

      - name: Build Kernel
        run: |
          rm -rf out
          export ARCH=arm64
          export SUBARCH=arm64
          
          echo "" > .scmversion
        
          make O=out vendor/sdmsteppe-perf_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/sweet.config
          scripts/config --file out/.config \
            -d LOCALVERSION_AUTO \
            -e KSU \
            -e KSU_SUSFS -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_OPEN_REDIRECT
          
          make O=out olddefconfig
          grep -E 'CONFIG_KSU|CONFIG_KSU_SUSFS|LTO' out/.config

          /usr/bin/time -v make -j2 O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/jksalcedo/AnyKernel3.git AnyKernel3
          B=out/arch/arm64/boot
          ls -la $B
          cp $B/Image.gz AnyKernel3/ 2>/dev/null || cp $B/Image AnyKernel3/ 2>/dev/null || cp $B/Image.gz-dtb AnyKernel3/ 2>/dev/null
          [ -f $B/dtbo.img ] && cp $B/dtbo.img AnyKernel3/
          [ -f $B/dtb.img ] && cp $B/dtb.img AnyKernel3/
          [ -f $B/dtb ] && cp $B/dtb AnyKernel3/dtb.img 2>/dev/null || true
          
          # Clean up unneeded files before uploading
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/*placeholder

          # Create flashable ZIP
          ZIP_NAME="MayonKernel-sweet-${{ env.KERNEL_VERSION }}+build.${{ github.run_number }}-${{ env.BUILD_DATE }}-linux-4.14.357.zip"
          (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" . -x ".git/*")
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Flashable ZIP (Action Artifact)
        uses: actions/upload-artifact@v6
        with:
          name: MayonKernel-sweet-${{ env.KERNEL_VERSION }}+build.${{ github.run_number }}-${{ env.BUILD_DATE }}-linux-4.14.357-mayon-perf
          path: AnyKernel3/*



