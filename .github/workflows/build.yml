name: build kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev \
            cpio zip lz4 python3 git curl ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch Neutron Clang
        run: |
          mkdir -p clang
          cd clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "$(pwd)/bin" >> $GITHUB_PATH
          cd ..
          clang --version
          
      - name: Setup KernelSU-Next & SUSFS
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          git clone --depth 1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git susfs_repo
          cp -r susfs_repo/kernel_patches/KernelSU/* KernelSU-Next/
          cd KernelSU-Next
          patch -p1 < 10_enable_susfs_for_ksu.patch
          cd ..

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
        
          make O=out vendor/sdmsteppe-perf_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/sweet.config
          scripts/config --file out/.config \
            -e KSU -e KSU_MANUAL_HOOK \
            -d KSU_KPROBES_HOOK -d KSU_SYSCALL_TABLE_HOOK \
            -e LTO_CLANG -e THINLTO \
            -e KSU_SUSFS -e KSU_SUSFS_HAS_MAGIC_MOUNT
          make O=out olddefconfig
          grep -E 'CONFIG_KSU|LTO' out/.config

          make -j$(nproc --all) O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/jksalcedo/AnyKernel3.git AnyKernel3
          B=out/arch/arm64/boot
          ls -la $B
          cp $B/Image.gz AnyKernel3/ 2>/dev/null || cp $B/Image AnyKernel3/ 2>/dev/null || cp $B/Image.gz-dtb AnyKernel3/ 2>/dev/null
          [ -f $B/dtbo.img ] && cp $B/dtbo.img AnyKernel3/
          cd AnyKernel3
          zip -r9 ../mayon-kernel-sweet.zip . -x ".git*" "README.md" "*placeholder"

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mayon-kernel-sweet
          path: mayon-kernel-sweet.zip
