name: release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build Workflow Run ID (check the URL of the successful build run)'
        required: true
        type: string
      kernel_version:
        description: 'Kernel Version / Tag (e.g. v0.1.0-beta.1)'
        required: true
        type: string
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for changelog generation

      - name: Download Artifact from Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh run view "$BUILD_RUN_ID" --json conclusion --jq .conclusion)" = success
          gh run download "$BUILD_RUN_ID" --dir downloaded_artifacts

          mapfile -d '' -t zips < <(find downloaded_artifacts -type f -name '*.zip' -print0)
          if (( ${#zips[@]} != 1 )); then
            echo "Expected exactly one flashable ZIP; found ${#zips[@]}." >&2
            exit 1
          fi
          for pair in bakasu-commit.txt:BAKASU_COMMIT bakasu-manager-run.txt:BAKASU_MANAGER_RUN kernel-commit.txt:KERNEL_COMMIT; do
            file=${pair%%:*}
            key=${pair#*:}
            mapfile -d '' -t matches < <(find downloaded_artifacts -type f -name "$file" -print0)
            if (( ${#matches[@]} != 1 )); then
              echo "Missing or ambiguous build metadata: $file. Use a build made with this workflow." >&2
              exit 1
            fi
            value=$(cat "${matches[0]}")
            if [[ "$key" == BAKASU_MANAGER_RUN ]]; then
              [[ "$value" =~ ^[0-9]+$ ]]
            else
              [[ "$value" =~ ^[0-9a-f]{40}$ ]]
            fi
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          {
            printf 'ZIP_PATH=%s\n' "${zips[0]}"
            printf 'ZIP_NAME=%s\n' "$(basename "${zips[0]}")"
          } >> "$GITHUB_ENV"

      - name: Generate Changelog
        id: changelog
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "$KERNEL_COMMIT" 2>/dev/null || echo "")
          echo "### 📝 Changelog" > changelog.md
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:" >> changelog.md
            git log "${PREV_TAG}..${KERNEL_COMMIT}" --pretty=format:"* %h - %s (%an)" >> changelog.md
          else
            echo "Recent changes:" >> changelog.md
            git log -n 15 "$KERNEL_COMMIT" --pretty=format:"* %h - %s (%an)" >> changelog.md
          fi
          echo "" >> changelog.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.kernel_version }}
          REQUESTED_PRERELEASE: ${{ inputs.is_prerelease }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          KERNEL_VERSION="$REQUESTED_VERSION"
          [[ "$KERNEL_VERSION" =~ ^v[0-9][A-Za-z0-9._+-]*$ ]]
          
          PRERELEASE_FLAG=""
          if [ "$REQUESTED_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            echo "Publishing as Pre-release"
          else
            echo "Publishing as Stable release"
          fi

          cat <<EOF > release_notes.md
          ## Mayon Kernel for Xiaomi Redmi Note 10 Pro (sweet / sweetin)

          ### Kernel Information
          - **Version:** \`${KERNEL_VERSION}\`
          - **Linux Version:** \`4.14.357-mayon-perf\`
          - **Build Run:** \`#${BUILD_RUN_ID}\`
          - **Installation:** Flash the attached \`${ZIP_NAME}\` via custom recovery (TWRP / OrangeFox).

          EOF

          cat changelog.md >> release_notes.md

          cat <<EOF >> release_notes.md

          ### Root & Hide Components
          - **BakaSU:** [${BAKASU_COMMIT}](https://github.com/Baka-SU/BakaSU/commit/${BAKASU_COMMIT})
          - **BakaSU Manager:** [Matching build — download Manager-release](https://github.com/Baka-SU/BakaSU/actions/runs/${BAKASU_MANAGER_RUN})
          - **Kernel source:** [${KERNEL_COMMIT}](https://github.com/${GITHUB_REPOSITORY}/commit/${KERNEL_COMMIT})
          - **SuSFS:** \`v2.3.0\`

          Install the arm64-v8a release APK from the matching Manager-release artifact.
          EOF

          if gh release view "${KERNEL_VERSION}" >/dev/null 2>&1; then
            echo "Updating existing release ${KERNEL_VERSION}..."
            gh release upload "${KERNEL_VERSION}" "${ZIP_PATH}" --clobber
            gh release edit "${KERNEL_VERSION}" --notes-file release_notes.md $PRERELEASE_FLAG
          else
            echo "Creating new release ${KERNEL_VERSION}..."
            gh release create "${KERNEL_VERSION}" "${ZIP_PATH}" \
              --title "Mayon Kernel ${KERNEL_VERSION}" \
              --notes-file release_notes.md \
              --target "$KERNEL_COMMIT" \
              $PRERELEASE_FLAG
          fi
