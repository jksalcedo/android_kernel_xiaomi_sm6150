name: Release Kernel

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build Workflow Run ID (check the URL of the successful build run)'
        required: true
        type: string
      kernel_version:
        description: 'Kernel Version / Tag (e.g. v0.1.0-beta.1)'
        required: true
        type: string
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  BAKASU_VERSION: 'v4.2.0-rc3'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for changelog generation

      - name: Download Artifact from Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading artifacts from run ${{ github.event.inputs.run_id }}..."
          gh run download ${{ github.event.inputs.run_id }} --dir downloaded_artifacts
          
          ZIP_FILE=$(find downloaded_artifacts -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip artifact found in run ${{ github.event.inputs.run_id }}"
            exit 1
          fi
          echo "ZIP_PATH=$ZIP_FILE" >> $GITHUB_ENV
          echo "ZIP_NAME=$(basename $ZIP_FILE)" >> $GITHUB_ENV

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "### 📝 Changelog" > changelog.md
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:" >> changelog.md
            git log ${PREV_TAG}..HEAD --pretty=format:"* %h - %s (%an)" >> changelog.md
          else
            echo "Recent changes:" >> changelog.md
            git log -n 15 --pretty=format:"* %h - %s (%an)" >> changelog.md
          fi
          echo "" >> changelog.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KERNEL_VERSION="${{ github.event.inputs.kernel_version }}"
          
          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            echo "Publishing as Pre-release"
          else
            echo "Publishing as Stable release"
          fi

          # Dynamically fetch BakaSU Manager download URLs
          BAKASU_ARM64_URL=$(gh api "repos/Baka-SU/BakaSU/releases/tags/${BAKASU_VERSION}" --jq '.assets[] | select(.name | test("arm64-v8a.*\\.apk$")) | .browser_download_url' 2>/dev/null || echo "")
          BAKASU_UNIVERSAL_URL=$(gh api "repos/Baka-SU/BakaSU/releases/tags/${BAKASU_VERSION}" --jq '.assets[] | select(.name | test("universal.*\\.apk$")) | .browser_download_url' 2>/dev/null || echo "")

          cat <<EOF > release_notes.md
          ## Mayon Kernel for Xiaomi Redmi Note 10 Pro (sweet / sweetin)

          ### 📦 Kernel Information
          - **Version:** \`${KERNEL_VERSION}\`
          - **Linux Version:** \`4.14.357\`
          - **Build Run:** \`#${{ github.event.inputs.run_id }}\`
          - **Installation:** Flash the attached \`${{ env.ZIP_NAME }}\` via custom recovery (TWRP / OrangeFox).

          EOF

          cat changelog.md >> release_notes.md

          cat <<EOF >> release_notes.md

          ### 🛡️ Root & Hide Components
          - **KernelSU (BakaSU):** [${BAKASU_VERSION}](https://github.com/Baka-SU/BakaSU/releases/tag/${BAKASU_VERSION})
          EOF

          if [ -n "$BAKASU_ARM64_URL" ]; then
            cat <<EOF >> release_notes.md
          - **BakaSU Manager (arm64-v8a):** [Download APK](${BAKASU_ARM64_URL})
          EOF
          fi

          if [ -n "$BAKASU_UNIVERSAL_URL" ]; then
            cat <<EOF >> release_notes.md
          - **BakaSU Manager (Universal):** [Download APK](${BAKASU_UNIVERSAL_URL})
          EOF
          fi

          cat <<EOF >> release_notes.md
          - **SuSFS:** \`v2.3.0\`

          > [!NOTE]
          > Make sure to install the matching BakaSU manager APK above for root management and SuSFS compatibility.
          EOF

          if gh release view "${KERNEL_VERSION}" >/dev/null 2>&1; then
            echo "Updating existing release ${KERNEL_VERSION}..."
            gh release upload "${KERNEL_VERSION}" "${{ env.ZIP_PATH }}" --clobber
            gh release edit "${KERNEL_VERSION}" --notes-file release_notes.md $PRERELEASE_FLAG
          else
            echo "Creating new release ${KERNEL_VERSION}..."
            gh release create "${KERNEL_VERSION}" "${{ env.ZIP_PATH }}" \
              --title "Mayon Kernel ${KERNEL_VERSION}" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG
          fi
